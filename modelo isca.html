<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dra. Kaline Cavalcante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

:root {
  --gold: #B8924A;
  --serif: 'Instrument Serif', Georgia, serif;
}

/* ── FOTO COBRE TUDO ── */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}
/* Gradiente: transparente no topo, muito escuro embaixo */
.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(10,8,6,.98) 0%,
    rgba(10,8,6,.65) 38%,
    rgba(10,8,6,.1)  65%,
    transparent      100%
  );
}

/* ── TOPO — Instagram handle ── */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 2;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ig-handle {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .06em;
  color: rgba(255,255,255,.55);
  text-decoration: none;
}
.ig-handle svg { opacity: .7; }
.ig-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .4; transform: scale(.7); }
}

/* ── CONTEÚDO INFERIOR ── */
.content {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 2;
  padding: 0 24px 44px;
}

/* Especialidade */
.tag {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  animation: up .55s ease .15s forwards;
}
.tag::before {
  content: '';
  width: 18px; height: 1px;
  background: var(--gold);
}

/* Nome */
.name {
  font-family: var(--serif);
  font-size: clamp(40px, 12vw, 56px);
  font-weight: 400;
  line-height: 1.0;
  color: #fff;
  margin-bottom: 6px;
  opacity: 0;
  animation: up .6s ease .28s forwards;
}
.name em {
  font-style: italic;
  color: var(--gold);
  display: block;
}

/* Subtítulo */
.sub {
  font-size: 13px;
  font-weight: 300;
  color: rgba(255,255,255,.45);
  letter-spacing: .04em;
  margin-bottom: 28px;
  opacity: 0;
  animation: up .6s ease .4s forwards;
}

/* Botões */
.btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  opacity: 0;
  animation: up .6s ease .55s forwards;
}

.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: var(--gold);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 16px;
  border-radius: 100px;
  text-decoration: none;
  transition: background .2s, transform .15s;
}
.btn-primary:active { transform: scale(.97); background: #9a7a3e; }

.btn-secondary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(255,255,255,.09);
  color: rgba(255,255,255,.8);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .04em;
  padding: 15px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.16);
  text-decoration: none;
  transition: background .2s;
}
.btn-secondary:active { background: rgba(255,255,255,.16); }

/* Stats laterais */
.side-stats {
  position: fixed;
  right: 16px;
  bottom: 220px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
  opacity: 0;
  animation: fadeIn .7s ease .9s forwards;
}
.side-stat {
  background: rgba(10,8,6,.5);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(184,146,74,.25);
  border-radius: 100px;
  padding: 6px 12px;
  font-size: 11px;
  color: rgba(255,255,255,.65);
  display: flex;
  align-items: center;
  gap: 5px;
}
.side-stat strong {
  color: var(--gold);
  font-weight: 500;
}

@keyframes up {
  from { opacity:0; transform: translateY(16px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
</style>
</head>
